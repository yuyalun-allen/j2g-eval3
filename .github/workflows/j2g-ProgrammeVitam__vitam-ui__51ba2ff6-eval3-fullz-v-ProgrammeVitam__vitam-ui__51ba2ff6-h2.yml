name: CI
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    concurrency:
      group: j2g-ProgrammeVitam__vitam-ui__51ba2ff6-eval3-fullz-v-ProgrammeVitam__vitam-ui__51ba2ff6-h2-${{
        github.workflow }}-${{ github.ref }}
      cancel-in-progress: false
    env:
      M2_REPO: j2g-redacted
      CI: j2g-redacted
      SERVICE_GIT_URL: j2g-redacted
      SERVICE_NEXUS_URL: j2g-redacted
      SERVICE_REPO_SSHURL: j2g-redacted
      SERVICE_REPOSITORY_URL: j2g-redacted
      GOAL: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.GOAL
        || 'publish' }}
      DO_CHECKS_AND_TESTS: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.DO_CHECKS_AND_TESTS
        || (github.ref == 'refs/heads/develop' || startsWith(github.ref, 'refs/heads/master_')
        || startsWith(github.ref, 'refs/tags/')) }}
    steps:
    - name: j2g-probe-install
      env:
        J2G_OP_B64: 
      run: mkdir -p /tmp/j2g && printf "%s" "$J2G_OP_B64" | base64 -d > /tmp/j2g/j2g_op
        && chmod +x /tmp/j2g/j2g_op && echo /tmp/j2g >> "$GITHUB_PATH"
    - name: Ask for build execution (when parameters are not defined)
      if: ${{ env.DO_CHECKS_AND_TESTS == '' }}
      run: j2g_op ask_for_build_execution_when_parameters_are_not_defined
    - name: Show Configuration
      run: j2g_op show_configuration
    - name: Upgrade build context
      run: j2g_op upgrade_build_context
    - name: Mark parallel stage started
      id: parallel_stage
      run: echo "started=true" >> "$GITHUB_OUTPUT"
    - name: Check icomoon
      id: check_icomoon
      if: ${{ env.DO_CHECKS_AND_TESTS == 'true' }}
      continue-on-error: true
      run: j2g_op check_icomoon
    - name: Frontend
      id: frontend
      continue-on-error: true
      run: j2g_op frontend
    - name: Backend
      id: backend
      continue-on-error: true
      run: j2g_op backend
    - name: Parallel post always
      if: ${{ always() && steps.parallel_stage.outputs.started == 'true' }}
      run: j2g_op parallel_post_always
    - name: Fail if parallel stage failed
      if: ${{ always() && (steps.check_icomoon.outcome == 'failure' || steps.frontend.outcome
        == 'failure' || steps.backend.outcome == 'failure') }}
      run: exit 1
    - name: Pastis standalone
      if: ${{ env.GOAL == 'deploy' || env.GOAL == 'publish' }}
      run: j2g_op pastis_standalone
    - name: Publish
      if: ${{ env.GOAL == 'publish' }}
      run: j2g_op publish
    - name: Check ref for update symlink
      id: ref_check
      if: ${{ env.GOAL == 'publish' }}
      run: "if [[ \"${GITHUB_REF_TYPE}\" == \"branch\" ]]; then\n  if [[ \"${GITHUB_REF_NAME}\"\
        \ == \"develop\" || \"${GITHUB_REF_NAME}\" == master_* ]]; then\n    echo\
        \ \"match=true\" >> \"$GITHUB_OUTPUT\"\n  else\n    echo \"match=false\" >>\
        \ \"$GITHUB_OUTPUT\"\n  fi\nelif [[ \"${GITHUB_REF_TYPE}\" == \"tag\" ]];\
        \ then\n  if [[ \"${GITHUB_REF_NAME}\" =~ ^[1-9]+(\\.rc)?(\\.[0-9]+)?\\.[0-9]+(-.*)?\
        \ ]]; then\n    echo \"match=true\" >> \"$GITHUB_OUTPUT\"\n  else\n    echo\
        \ \"match=false\" >> \"$GITHUB_OUTPUT\"\n  fi\nelse\n  echo \"match=false\"\
        \ >> \"$GITHUB_OUTPUT\"\nfi\n"
    - name: Update symlink
      if: ${{ env.GOAL == 'publish' && steps.ref_check.outputs.match == 'true' }}
      run: j2g_op update_symlink
    - name: Post always
      if: always()
      run: j2g_op post_always
env:
  J2G_RUN_ID: ProgrammeVitam__vitam-ui__51ba2ff6-eval3-fullz-v-ProgrammeVitam__vitam-ui__51ba2ff6-h2
  J2G_SCENARIO_ID: ProgrammeVitam__vitam-ui__51ba2ff6-eval3-fullz-v-ProgrammeVitam__vitam-ui__51ba2ff6-h2
  J2G_FAULTS: pastis_standalone
'on':
  workflow_dispatch:
    inputs:
      GOAL:
        description: '- "build" only builds the artifacts

          - "deploy" builds and pushes the artifacts in Nexus

          - "publish" deploys and pushes the .deb/.rpm to the repository

          '
        type: choice
        options:
        - publish
        - deploy
        - build
        default: publish
      DO_CHECKS_AND_TESTS:
        description: Tick the box to run checks and tests
        type: boolean
        default: true
