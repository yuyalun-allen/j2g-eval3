name: j2g-importer-71e163756dcd
env:
  DOCKER_COMPOSE_FILE: j2g-redacted
  J2G_RUN_ID: fmartingv__Pipeline-CICD-Jenkins-AWS__f76e2e72-eval3-imp-repair-counterexample-after-h2
  J2G_SCENARIO_ID: fmartingv__Pipeline-CICD-Jenkins-AWS__f76e2e72-eval3-imp-repair-counterexample-after-h2
  J2G_FAULTS: build_docker_image
jobs:
  Checkout:
    runs-on: ubuntu-latest
    steps:
    - name: j2g-probe-install
      env:
        J2G_OP_B64: 
      run: mkdir -p /tmp/j2g && printf "%s" "$J2G_OP_B64" | base64 -d > /tmp/j2g/j2g_op
        && chmod +x /tmp/j2g/j2g_op && echo /tmp/j2g >> "$GITHUB_PATH"
    - name: checkout
      uses: actions/checkout@v4.1.0
    - name: sh
      shell: bash
      run: j2g_op checkout
  Install_Dependencies:
    name: Install Dependencies
    runs-on: ubuntu-latest
    needs: Checkout
    steps:
    - name: j2g-probe-install
      env:
        J2G_OP_B64: 
      run: mkdir -p /tmp/j2g && printf "%s" "$J2G_OP_B64" | base64 -d > /tmp/j2g/j2g_op
        && chmod +x /tmp/j2g/j2g_op && echo /tmp/j2g >> "$GITHUB_PATH"
    - name: checkout
      uses: actions/checkout@v4.1.0
    - name: sh
      shell: bash
      run: j2g_op install_dependencies
  Run_Tests:
    name: Run Tests
    runs-on: ubuntu-latest
    needs: Install_Dependencies
    steps:
    - name: j2g-probe-install
      env:
        J2G_OP_B64: 
      run: mkdir -p /tmp/j2g && printf "%s" "$J2G_OP_B64" | base64 -d > /tmp/j2g/j2g_op
        && chmod +x /tmp/j2g/j2g_op && echo /tmp/j2g >> "$GITHUB_PATH"
    - name: checkout
      uses: actions/checkout@v4.1.0
    - name: sh
      shell: bash
      run: j2g_op run_tests
  Build_Docker_Image:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: Run_Tests
    steps:
    - name: j2g-probe-install
      env:
        J2G_OP_B64: 
      run: mkdir -p /tmp/j2g && printf "%s" "$J2G_OP_B64" | base64 -d > /tmp/j2g/j2g_op
        && chmod +x /tmp/j2g/j2g_op && echo /tmp/j2g >> "$GITHUB_PATH"
    - name: checkout
      uses: actions/checkout@v4.1.0
    - name: sh
      shell: bash
      run: j2g_op build_docker_image
  Deploy:
    runs-on: ubuntu-latest
    needs: Build_Docker_Image
    steps:
    - name: j2g-probe-install
      env:
        J2G_OP_B64: 
      run: mkdir -p /tmp/j2g && printf "%s" "$J2G_OP_B64" | base64 -d > /tmp/j2g/j2g_op
        && chmod +x /tmp/j2g/j2g_op && echo /tmp/j2g >> "$GITHUB_PATH"
    - name: checkout
      uses: actions/checkout@v4.1.0
    - name: sh
      shell: bash
      run: j2g_op deploy
  Post-Build:
    if: always()
    name: Post Build
    runs-on: ubuntu-latest
    needs:
    - Checkout
    - Install_Dependencies
    - Run_Tests
    - Build_Docker_Image
    - Deploy
    steps:
    - name: j2g-probe-install
      env:
        J2G_OP_B64: 
      run: mkdir -p /tmp/j2g && printf "%s" "$J2G_OP_B64" | base64 -d > /tmp/j2g/j2g_op
        && chmod +x /tmp/j2g/j2g_op && echo /tmp/j2g >> "$GITHUB_PATH"
    - name: snapshot initial result
      id: initial
      if: always()
      run: "if [ \"${{ contains(needs.*.result, 'failure') }}\" = \"true\" ]; then\n\
        \  echo \"result=failure\" >> \"$GITHUB_OUTPUT\"\nelif [ \"${{ contains(needs.*.result,\
        \ 'cancelled') }}\" = \"true\" ]; then\n  echo \"result=other\" >> \"$GITHUB_OUTPUT\"\
        \nelse\n  echo \"result=success\" >> \"$GITHUB_OUTPUT\"\nfi\n"
    - name: sh
      id: post_always
      shell: bash
      run: j2g_op post_always
      if: always()
    - name: sh
      id: post_success
      shell: bash
      run: j2g_op post_success
      if: always() && steps.initial.outputs.result == 'success' && steps.post_always.outcome
        == 'success'
    - name: sh
      id: post_failure
      shell: bash
      run: j2g_op post_failure
      if: always() && (steps.initial.outputs.result == 'failure' || steps.post_always.outcome
        == 'failure' || steps.post_always.outcome == 'cancelled' || steps.post_success.outcome
        == 'failure' || steps.post_success.outcome == 'cancelled')
'on':
  workflow_dispatch: null
