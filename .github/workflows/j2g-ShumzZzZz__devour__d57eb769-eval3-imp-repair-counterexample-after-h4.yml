    if: ${{ github.event_name == 'pull_request' }}
    name: Type Check / Pyright
    runs-on: ubuntu-latest
    env:
      TYPECHECK_PATH: j2g-redacted
      GITHUB_CONTEXT: j2g-redacted
    needs: Format_Ruff
    steps:
    - name: j2g-probe-install
