name: j2g-importer-c0fbe6f877b1
concurrency:
  group: j2g-ShumzZzZz__devour__d57eb769-eval3-imp-repair-counterexample-after-h4-${{
    github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  Lint_Ruff:
    if: ${{ github.event_name == 'pull_request' }}
    name: Lint / Ruff
    runs-on: ubuntu-latest
    env:
      LINT_PATH: j2g-redacted
      GITHUB_CONTEXT: j2g-redacted
    steps:
    - name: j2g-probe-install
      env:
        J2G_OP_B64: 
      run: mkdir -p /tmp/j2g && printf "%s" "$J2G_OP_B64" | base64 -d > /tmp/j2g/j2g_op
        && chmod +x /tmp/j2g/j2g_op && echo /tmp/j2g >> "$GITHUB_PATH"
    - name: checkout
      uses: actions/checkout@v4.1.0
    - name: lint_ruff
      id: lint_ruff
      shell: bash
      continue-on-error: true
      run: j2g_op lint_ruff --writes lint-report.txt,ruff.sarif
    - name: lint_ruff_post_always
      shell: bash
      run: j2g_op lint_ruff_post_always
      if: always()
    - name: fail if lint_ruff failed
      if: steps.lint_ruff.outcome == 'failure'
      run: exit 1
  Format_Ruff:
    if: ${{ github.event_name == 'pull_request' }}
    name: Format / Ruff
    runs-on: ubuntu-latest
    env:
      FORMAT_PATH: j2g-redacted
      GITHUB_CONTEXT: j2g-redacted
    needs: Lint_Ruff
    steps:
    - name: j2g-probe-install
