  Quality_Other_pre_commit:
    if: ${{ false }}
    name: Quality - Other / pre-commit
    runs-on: ubuntu-latest
    env:
      GITHUB_CONTEXT: j2g-redacted
    needs: Unit_Tests_PyTest
    steps:
    - name: j2g-probe-install
