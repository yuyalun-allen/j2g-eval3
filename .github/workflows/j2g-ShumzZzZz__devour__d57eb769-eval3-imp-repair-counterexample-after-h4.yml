      shell: bash
      continue-on-error: true
      run: j2g_op format_ruff --writes ruff-format-report.txt
    - name: format_ruff_post_always
      shell: bash
      run: j2g_op format_ruff_post_always
      if: always()
    - name: fail if format_ruff failed
      if: steps.format_ruff.outcome == 'failure'
      run: exit 1
  Format_Ruff_Main_Auto_fix_:
    if: ${{ github.ref == 'refs/heads/main' }}
    name: Format / Ruff (Main Auto-fix)
    runs-on: ubuntu-latest
    env:
      FORMAT_PATH: j2g-redacted
