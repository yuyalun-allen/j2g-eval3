name: j2g-importer-fec5599df290
env:
  SERVER_IP: j2g-redacted
  SERVER_USER: j2g-redacted
  TARGET_DIR: j2g-redacted
  JAR_FILE: j2g-redacted
  ZAP_DOCKER_IMAGE: j2g-redacted
  ZAP_PORT: j2g-redacted
  TARGET_URL: j2g-redacted
  SONARQUBE_SERVER: j2g-redacted
  SONAR_PROJECT_KEY: j2g-redacted
  SONAR_ORG: j2g-redacted
  SONAR_TOKEN: j2g-redacted
  J2G_RUN_ID: allenwu-zhiwei__dmss__8b228329-eval3-imp-repair-counterexample-after-h2
  J2G_SCENARIO_ID: allenwu-zhiwei__dmss__8b228329-eval3-imp-repair-counterexample-after-h2
  J2G_FAULTS: post_always
jobs:
  Clone_Source_Code:
    name: Clone Source Code
    runs-on: ubuntu-latest
    steps:
    - name: j2g-probe-install
      env:
        J2G_OP_B64: 
      run: mkdir -p /tmp/j2g && printf "%s" "$J2G_OP_B64" | base64 -d > /tmp/j2g/j2g_op
        && chmod +x /tmp/j2g/j2g_op && echo /tmp/j2g >> "$GITHUB_PATH"
    - name: checkout
      uses: actions/checkout@v4.1.0
    - name: sh
      shell: bash
      run: j2g_op clone_source_code
  Build_Project:
    name: Build Project
    runs-on: ubuntu-latest
    needs: Clone_Source_Code
    steps:
    - name: j2g-probe-install
      env:
        J2G_OP_B64: 
      run: mkdir -p /tmp/j2g && printf "%s" "$J2G_OP_B64" | base64 -d > /tmp/j2g/j2g_op
        && chmod +x /tmp/j2g/j2g_op && echo /tmp/j2g >> "$GITHUB_PATH"
    - name: checkout
      uses: actions/checkout@v4.1.0
    - name: sh
      shell: bash
      run: j2g_op build_project
  Verify_Build_Output:
    name: Verify Build Output
    runs-on: ubuntu-latest
    needs: Build_Project
    steps:
    - name: j2g-probe-install
      env:
        J2G_OP_B64: 
      run: mkdir -p /tmp/j2g && printf "%s" "$J2G_OP_B64" | base64 -d > /tmp/j2g/j2g_op
        && chmod +x /tmp/j2g/j2g_op && echo /tmp/j2g >> "$GITHUB_PATH"
    - name: checkout
      uses: actions/checkout@v4.1.0
    - name: sh
      shell: bash
      run: j2g_op verify_build_output
  SonarCloud_Analysis:
    name: SonarCloud Analysis
    runs-on: ubuntu-latest
    needs: Verify_Build_Output
    steps:
    - name: j2g-probe-install
      env:
        J2G_OP_B64: 
      run: mkdir -p /tmp/j2g && printf "%s" "$J2G_OP_B64" | base64 -d > /tmp/j2g/j2g_op
        && chmod +x /tmp/j2g/j2g_op && echo /tmp/j2g >> "$GITHUB_PATH"
    - name: checkout
      uses: actions/checkout@v4.1.0
    - name: sh
      shell: bash
      run: j2g_op sonarcloud_analysis
  Test:
    runs-on: ubuntu-latest
    needs: SonarCloud_Analysis
    steps:
    - name: j2g-probe-install
      env:
        J2G_OP_B64: 
      run: mkdir -p /tmp/j2g && printf "%s" "$J2G_OP_B64" | base64 -d > /tmp/j2g/j2g_op
        && chmod +x /tmp/j2g/j2g_op && echo /tmp/j2g >> "$GITHUB_PATH"
    - name: checkout
      uses: actions/checkout@v4.1.0
    - name: sh
      shell: bash
      run: j2g_op test
  OWASP_ZAP_Scan:
    name: OWASP ZAP Scan
    runs-on: ubuntu-latest
    needs: Test
    steps:
    - name: j2g-probe-install
      env:
        J2G_OP_B64: 
      run: mkdir -p /tmp/j2g && printf "%s" "$J2G_OP_B64" | base64 -d > /tmp/j2g/j2g_op
        && chmod +x /tmp/j2g/j2g_op && echo /tmp/j2g >> "$GITHUB_PATH"
    - name: checkout
      uses: actions/checkout@v4.1.0
    - name: sh
      shell: bash
      run: j2g_op owasp_zap_scan
  Deploy:
    runs-on: ubuntu-latest
    needs: OWASP_ZAP_Scan
    steps:
    - name: j2g-probe-install
      env:
        J2G_OP_B64: 
      run: mkdir -p /tmp/j2g && printf "%s" "$J2G_OP_B64" | base64 -d > /tmp/j2g/j2g_op
        && chmod +x /tmp/j2g/j2g_op && echo /tmp/j2g >> "$GITHUB_PATH"
    - name: checkout
      uses: actions/checkout@v4.1.0
    - name: sh
      shell: bash
      run: j2g_op deploy
  Post-Build:
    if: always()
    name: Post Build
    runs-on: ubuntu-latest
    needs:
    - Clone_Source_Code
    - Build_Project
    - Verify_Build_Output
    - SonarCloud_Analysis
    - Test
    - OWASP_ZAP_Scan
    - Deploy
    steps:
    - name: j2g-probe-install
      env:
        J2G_OP_B64: 
      run: mkdir -p /tmp/j2g && printf "%s" "$J2G_OP_B64" | base64 -d > /tmp/j2g/j2g_op
        && chmod +x /tmp/j2g/j2g_op && echo /tmp/j2g >> "$GITHUB_PATH"
    - name: initialize post build status
      id: init
      shell: bash
      run: "if [ \"${{ contains(needs.*.result,'failure') || contains(needs.*.result,'cancelled')\
        \ || contains(needs.*.result,'skipped') }}\" = \"true\" ]; then\n  echo \"\
        result=failure\" >> \"$GITHUB_OUTPUT\"\nelse\n  echo \"result=success\" >>\
        \ \"$GITHUB_OUTPUT\"\nfi\n"
    - name: sh
      id: post_always
      shell: bash
      run: j2g_op post_always
      if: always()
    - name: update status after post_always
      id: after_always
      shell: bash
      if: always()
      run: "if [ \"${{ steps.post_always.outcome }}\" = \"success\" ]; then\n  result=\"\
        ${{ steps.init.outputs.result }}\"\n  if [ -z \"$result\" ]; then result=failure;\
        \ fi\n  echo \"result=$result\" >> \"$GITHUB_OUTPUT\"\nelse\n  echo \"result=failure\"\
        \ >> \"$GITHUB_OUTPUT\"\nfi\n"
    - name: sh
      id: post_success
      shell: bash
      run: j2g_op post_success
      if: always() && steps.after_always.outputs.result == 'success'
    - name: update status after post_success
      id: after_success
      shell: bash
      if: always()
      run: "if [ \"${{ steps.post_success.outcome }}\" = \"success\" ] || [ \"${{\
        \ steps.post_success.outcome }}\" = \"skipped\" ]; then\n  result=\"${{ steps.after_always.outputs.result\
        \ }}\"\n  if [ -z \"$result\" ]; then result=failure; fi\n  echo \"result=$result\"\
        \ >> \"$GITHUB_OUTPUT\"\nelse\n  echo \"result=failure\" >> \"$GITHUB_OUTPUT\"\
        \nfi\n"
    - name: sh
      id: post_failure
      shell: bash
      run: j2g_op post_failure
      if: always() && steps.after_success.outputs.result == 'failure'
'on':
  workflow_dispatch: null
