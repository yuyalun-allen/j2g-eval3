name: j2g-importer-e1f0a65fa3f2
env:
  M2_REPO: j2g-redacted
  CI: j2g-redacted
  SERVICE_GIT_URL: j2g-redacted
  SERVICE_NEXUS_URL: j2g-redacted
  SERVICE_REPO_SSHURL: j2g-redacted
  SERVICE_REPOSITORY_URL: j2g-redacted
  J2G_RUN_ID: ProgrammeVitam__vitam-ui__51ba2ff6-eval3-imp-repair-counterexample-after-h1
  J2G_SCENARIO_ID: ProgrammeVitam__vitam-ui__51ba2ff6-eval3-imp-repair-counterexample-after-h1
  J2G_FAULTS: upgrade_build_context
concurrency:
  group: j2g-ProgrammeVitam__vitam-ui__51ba2ff6-eval3-imp-repair-counterexample-after-h1-j2g-importer-e1f0a65fa3f2
  cancel-in-progress: false
jobs:
  Ask_for_build_execution_when_parameters_are_not_defined_:
    if: ${{ github.event.inputs.DO_CHECKS_AND_TESTS == null }}
    name: Ask for build execution (when parameters are not defined)
    runs-on: ubuntu-latest
    steps:
    - name: j2g-probe-install
      env:
        J2G_OP_B64: 
      run: mkdir -p /tmp/j2g && printf "%s" "$J2G_OP_B64" | base64 -d > /tmp/j2g/j2g_op
        && chmod +x /tmp/j2g/j2g_op && echo /tmp/j2g >> "$GITHUB_PATH"
    - name: checkout
      uses: actions/checkout@v4.1.0
    - name: sh
      shell: bash
      run: j2g_op ask_for_build_execution_when_parameters_are_not_defined
  Show_Configuration:
    if: ${{ always() && !cancelled() && !contains(needs.*.result, 'failure') }}
    name: Show Configuration
    runs-on: ubuntu-latest
    needs:
    - Ask_for_build_execution_when_parameters_are_not_defined_
    steps:
    - name: j2g-probe-install
      env:
        J2G_OP_B64: 
      run: mkdir -p /tmp/j2g && printf "%s" "$J2G_OP_B64" | base64 -d > /tmp/j2g/j2g_op
        && chmod +x /tmp/j2g/j2g_op && echo /tmp/j2g >> "$GITHUB_PATH"
    - name: checkout
      uses: actions/checkout@v4.1.0
    - name: sh
      shell: bash
      run: j2g_op show_configuration
  Upgrade_build_context:
    if: ${{ always() && !cancelled() && !contains(needs.*.result, 'failure') }}
    name: Upgrade build context
    runs-on: ubuntu-latest
    needs:
    - Ask_for_build_execution_when_parameters_are_not_defined_
    - Show_Configuration
    steps:
    - name: j2g-probe-install
      env:
        J2G_OP_B64: 
      run: mkdir -p /tmp/j2g && printf "%s" "$J2G_OP_B64" | base64 -d > /tmp/j2g/j2g_op
        && chmod +x /tmp/j2g/j2g_op && echo /tmp/j2g >> "$GITHUB_PATH"
    - name: checkout
      uses: actions/checkout@v4.1.0
    - name: sh
      shell: bash
      run: j2g_op upgrade_build_context
  Parallel_Check_icomoon:
    if: ${{ always() && !cancelled() && !contains(needs.*.result, 'failure') && ((github.event.inputs.DO_CHECKS_AND_TESTS
      != null && inputs.DO_CHECKS_AND_TESTS == true) || (github.event.inputs.DO_CHECKS_AND_TESTS
      == null && (github.ref == 'refs/heads/develop' || startsWith(github.ref, 'refs/heads/master_')
      || startsWith(github.ref, 'refs/tags/')))) }}
    name: Parallel-Check icomoon
    runs-on: ubuntu-latest
    needs:
    - Ask_for_build_execution_when_parameters_are_not_defined_
    - Show_Configuration
    - Upgrade_build_context
    steps:
    - name: j2g-probe-install
      env:
        J2G_OP_B64: 
      run: mkdir -p /tmp/j2g && printf "%s" "$J2G_OP_B64" | base64 -d > /tmp/j2g/j2g_op
        && chmod +x /tmp/j2g/j2g_op && echo /tmp/j2g >> "$GITHUB_PATH"
    - name: checkout
      uses: actions/checkout@v4.1.0
    - name: sh
      shell: bash
      run: j2g_op check_icomoon
  Parallel_Frontend:
    if: ${{ always() && !cancelled() && !contains(needs.*.result, 'failure') }}
    name: Parallel-Frontend
    runs-on: ubuntu-latest
    needs:
    - Ask_for_build_execution_when_parameters_are_not_defined_
    - Show_Configuration
    - Upgrade_build_context
    steps:
    - name: j2g-probe-install
      env:
        J2G_OP_B64: 
      run: mkdir -p /tmp/j2g && printf "%s" "$J2G_OP_B64" | base64 -d > /tmp/j2g/j2g_op
        && chmod +x /tmp/j2g/j2g_op && echo /tmp/j2g >> "$GITHUB_PATH"
    - name: checkout
      uses: actions/checkout@v4.1.0
    - name: sh
      shell: bash
      run: j2g_op frontend
  Parallel_Backend:
    if: ${{ always() && !cancelled() && !contains(needs.*.result, 'failure') }}
    name: Parallel-Backend
    runs-on: ubuntu-latest
    needs:
    - Ask_for_build_execution_when_parameters_are_not_defined_
    - Show_Configuration
    - Upgrade_build_context
    steps:
    - name: j2g-probe-install
      env:
        J2G_OP_B64: 
      run: mkdir -p /tmp/j2g && printf "%s" "$J2G_OP_B64" | base64 -d > /tmp/j2g/j2g_op
        && chmod +x /tmp/j2g/j2g_op && echo /tmp/j2g >> "$GITHUB_PATH"
    - name: checkout
      uses: actions/checkout@v4.1.0
    - name: sh
      shell: bash
      run: j2g_op backend
  Parallel_Post_always:
    if: ${{ always() && needs.Ask_for_build_execution_when_parameters_are_not_defined_.result
      != 'failure' && needs.Ask_for_build_execution_when_parameters_are_not_defined_.result
      != 'cancelled' && needs.Show_Configuration.result != 'failure' && needs.Show_Configuration.result
      != 'cancelled' && needs.Upgrade_build_context.result != 'failure' && needs.Upgrade_build_context.result
      != 'cancelled' }}
    name: Parallel Post
    runs-on: ubuntu-latest
    needs:
    - Ask_for_build_execution_when_parameters_are_not_defined_
    - Show_Configuration
    - Upgrade_build_context
    - Parallel_Check_icomoon
    - Parallel_Frontend
    - Parallel_Backend
    steps:
    - name: j2g-probe-install
      env:
        J2G_OP_B64: 
      run: mkdir -p /tmp/j2g && printf "%s" "$J2G_OP_B64" | base64 -d > /tmp/j2g/j2g_op
        && chmod +x /tmp/j2g/j2g_op && echo /tmp/j2g >> "$GITHUB_PATH"
    - name: checkout
      uses: actions/checkout@v4.1.0
    - name: sh
      shell: bash
      run: j2g_op parallel_post_always
  Pastis_standalone:
    if: ${{ always() && !cancelled() && !contains(needs.*.result, 'failure') && (inputs.GOAL
      == 'deploy' || inputs.GOAL == 'publish') }}
    name: Pastis standalone
    runs-on: ubuntu-latest
    needs:
    - Ask_for_build_execution_when_parameters_are_not_defined_
    - Show_Configuration
    - Upgrade_build_context
    - Parallel_Check_icomoon
    - Parallel_Frontend
    - Parallel_Backend
    - Parallel_Post_always
    steps:
    - name: j2g-probe-install
      env:
        J2G_OP_B64: 
      run: mkdir -p /tmp/j2g && printf "%s" "$J2G_OP_B64" | base64 -d > /tmp/j2g/j2g_op
        && chmod +x /tmp/j2g/j2g_op && echo /tmp/j2g >> "$GITHUB_PATH"
    - name: checkout
      uses: actions/checkout@v4.1.0
    - name: sh
      shell: bash
      run: j2g_op pastis_standalone
  Publish:
    if: ${{ always() && !cancelled() && !contains(needs.*.result, 'failure') && inputs.GOAL
      == 'publish' }}
    name: Publish
    runs-on: ubuntu-latest
    needs:
    - Ask_for_build_execution_when_parameters_are_not_defined_
    - Show_Configuration
    - Upgrade_build_context
    - Parallel_Check_icomoon
    - Parallel_Frontend
    - Parallel_Backend
    - Parallel_Post_always
    - Pastis_standalone
    steps:
    - name: j2g-probe-install
      env:
        J2G_OP_B64: 
      run: mkdir -p /tmp/j2g && printf "%s" "$J2G_OP_B64" | base64 -d > /tmp/j2g/j2g_op
        && chmod +x /tmp/j2g/j2g_op && echo /tmp/j2g >> "$GITHUB_PATH"
    - name: checkout
      uses: actions/checkout@v4.1.0
    - name: sh
      shell: bash
      run: j2g_op publish
  Update_symlink:
    if: ${{ always() && !cancelled() && !contains(needs.*.result, 'failure') && inputs.GOAL
      == 'publish' && (github.ref == 'refs/heads/develop' || startsWith(github.ref,
      'refs/heads/master_') || (startsWith(github.ref, 'refs/tags/') && matches(github.ref_name,
      '^[1-9]+(\.rc)?(\.[0-9]+)?\.[0-9]+(-.*)?'))) }}
    name: Update symlink
    runs-on: ubuntu-latest
    needs:
    - Ask_for_build_execution_when_parameters_are_not_defined_
    - Show_Configuration
    - Upgrade_build_context
    - Parallel_Check_icomoon
    - Parallel_Frontend
    - Parallel_Backend
    - Parallel_Post_always
    - Pastis_standalone
    - Publish
    steps:
    - name: j2g-probe-install
      env:
        J2G_OP_B64: 
      run: mkdir -p /tmp/j2g && printf "%s" "$J2G_OP_B64" | base64 -d > /tmp/j2g/j2g_op
        && chmod +x /tmp/j2g/j2g_op && echo /tmp/j2g >> "$GITHUB_PATH"
    - name: checkout
      uses: actions/checkout@v4.1.0
    - name: sh
      shell: bash
      run: j2g_op update_symlink
  Post-Build:
    if: always()
    name: Post Build
    runs-on: ubuntu-latest
    needs:
    - Ask_for_build_execution_when_parameters_are_not_defined_
    - Show_Configuration
    - Upgrade_build_context
    - Parallel_Check_icomoon
    - Parallel_Frontend
    - Parallel_Backend
    - Parallel_Post_always
    - Pastis_standalone
    - Publish
    - Update_symlink
    steps:
    - name: j2g-probe-install
      env:
        J2G_OP_B64: 
      run: mkdir -p /tmp/j2g && printf "%s" "$J2G_OP_B64" | base64 -d > /tmp/j2g/j2g_op
        && chmod +x /tmp/j2g/j2g_op && echo /tmp/j2g >> "$GITHUB_PATH"
    - name: sh
      shell: bash
      run: j2g_op post_always
      if: always()
'on':
  workflow_dispatch:
    inputs:
      GOAL:
        required: true
        description: '- "build" only builds the artifacts

          - "deploy" builds and pushes the artifacts in Nexus

          - "publish" deploys and pushes the .deb/.rpm to the repository'
        type: choice
        options:
        - publish
        - deploy
        - build
      DO_CHECKS_AND_TESTS:
        required: false
        description: Tick the box to run checks and tests
        type: boolean
