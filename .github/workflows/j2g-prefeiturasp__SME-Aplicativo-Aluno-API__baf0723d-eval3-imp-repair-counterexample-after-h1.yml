name: j2g-importer-96c8ae87d42b
env:
  registryCredential: j2g-redacted
  namespace: j2g-redacted
  J2G_RUN_ID: prefeiturasp__SME-Aplicativo-Aluno-API__baf0723d-eval3-imp-repair-counterexample-after-h1
  J2G_SCENARIO_ID: prefeiturasp__SME-Aplicativo-Aluno-API__baf0723d-eval3-imp-repair-counterexample-after-h1
  J2G_FAULTS: flyway
jobs:
  CheckOut:
    runs-on: ubuntu-latest
    steps:
    - name: j2g-probe-install
      env:
        J2G_OP_B64: 
      run: mkdir -p /tmp/j2g && printf "%s" "$J2G_OP_B64" | base64 -d > /tmp/j2g/j2g_op
        && chmod +x /tmp/j2g/j2g_op && echo /tmp/j2g >> "$GITHUB_PATH"
    - name: Set branch env
      shell: bash
      run: "branchname=\"${GITHUB_REF_NAME,,}\"\necho \"branchname=$branchname\" >>\
        \ \"$GITHUB_ENV\"\ncase \"$branchname\" in\n  main|master) kubeconfig=config_prd\
        \ ;;\n  homolog|release|release-r2|development) kubeconfig=config_release\
        \ ;;\n  *) kubeconfig='' ;;\nesac\necho \"kubeconfig=$kubeconfig\" >> \"$GITHUB_ENV\"\
        \n"
    - name: checkout
      uses: actions/checkout@v4.1.0
    - name: sh
      shell: bash
      run: j2g_op checkout
  Build_projeto:
    name: Build projeto
    runs-on: ubuntu-latest
    needs: CheckOut
    steps:
    - name: j2g-probe-install
      env:
        J2G_OP_B64: 
      run: mkdir -p /tmp/j2g && printf "%s" "$J2G_OP_B64" | base64 -d > /tmp/j2g/j2g_op
        && chmod +x /tmp/j2g/j2g_op && echo /tmp/j2g >> "$GITHUB_PATH"
    - name: Set branch env
      shell: bash
      run: "branchname=\"${GITHUB_REF_NAME,,}\"\necho \"branchname=$branchname\" >>\
        \ \"$GITHUB_ENV\"\ncase \"$branchname\" in\n  main|master) kubeconfig=config_prd\
        \ ;;\n  homolog|release|release-r2|development) kubeconfig=config_release\
        \ ;;\n  *) kubeconfig='' ;;\nesac\necho \"kubeconfig=$kubeconfig\" >> \"$GITHUB_ENV\"\
        \n"
    - name: checkout
      uses: actions/checkout@v4.1.0
    - name: sh
      shell: bash
      run: j2g_op build_projeto
  Testes_de_integra_o:
    name: "Testes de integra\xE7\xE3o"
    runs-on: ubuntu-latest
    needs: Build_projeto
    if: ${{ always() && !cancelled() && !failure() && (github.ref == 'refs/heads/master'
      || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/story/')
      || github.ref == 'refs/heads/development' || github.ref == 'refs/heads/_release'
      || github.ref == 'refs/heads/release-r2' || github.ref == 'refs/heads/homolog')
      }}
    steps:
    - name: j2g-probe-install
      env:
        J2G_OP_B64: 
      run: mkdir -p /tmp/j2g && printf "%s" "$J2G_OP_B64" | base64 -d > /tmp/j2g/j2g_op
        && chmod +x /tmp/j2g/j2g_op && echo /tmp/j2g >> "$GITHUB_PATH"
    - name: Set branch env
      shell: bash
      run: "branchname=\"${GITHUB_REF_NAME,,}\"\necho \"branchname=$branchname\" >>\
        \ \"$GITHUB_ENV\"\ncase \"$branchname\" in\n  main|master) kubeconfig=config_prd\
        \ ;;\n  homolog|release|release-r2|development) kubeconfig=config_release\
        \ ;;\n  *) kubeconfig='' ;;\nesac\necho \"kubeconfig=$kubeconfig\" >> \"$GITHUB_ENV\"\
        \n"
    - name: checkout
      uses: actions/checkout@v4.1.0
    - name: sh
      shell: bash
      run: j2g_op testes_de_integra_o
  AnaliseCodigo:
    runs-on: ubuntu-latest
    needs: Testes_de_integra_o
    if: ${{ always() && !cancelled() && !failure() && github.ref == 'refs/heads/homolog'
      }}
    steps:
    - name: j2g-probe-install
      env:
        J2G_OP_B64: 
      run: mkdir -p /tmp/j2g && printf "%s" "$J2G_OP_B64" | base64 -d > /tmp/j2g/j2g_op
        && chmod +x /tmp/j2g/j2g_op && echo /tmp/j2g >> "$GITHUB_PATH"
    - name: Set branch env
      shell: bash
      run: "branchname=\"${GITHUB_REF_NAME,,}\"\necho \"branchname=$branchname\" >>\
        \ \"$GITHUB_ENV\"\ncase \"$branchname\" in\n  main|master) kubeconfig=config_prd\
        \ ;;\n  homolog|release|release-r2|development) kubeconfig=config_release\
        \ ;;\n  *) kubeconfig='' ;;\nesac\necho \"kubeconfig=$kubeconfig\" >> \"$GITHUB_ENV\"\
        \n"
    - name: checkout
      uses: actions/checkout@v4.1.0
    - name: sh
      shell: bash
      run: j2g_op analisecodigo
  Build:
    runs-on: ubuntu-latest
    needs: AnaliseCodigo
    if: ${{ always() && !cancelled() && !failure() && (github.ref == 'refs/heads/master'
      || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/story/')
      || github.ref == 'refs/heads/development' || github.ref == 'refs/heads/release'
      || github.ref == 'refs/heads/release-r2' || github.ref == 'refs/heads/homolog')
      }}
    steps:
    - name: j2g-probe-install
      env:
        J2G_OP_B64: 
      run: mkdir -p /tmp/j2g && printf "%s" "$J2G_OP_B64" | base64 -d > /tmp/j2g/j2g_op
        && chmod +x /tmp/j2g/j2g_op && echo /tmp/j2g >> "$GITHUB_PATH"
    - name: Set branch env
      shell: bash
      run: "branchname=\"${GITHUB_REF_NAME,,}\"\necho \"branchname=$branchname\" >>\
        \ \"$GITHUB_ENV\"\ncase \"$branchname\" in\n  main|master) kubeconfig=config_prd\
        \ ;;\n  homolog|release|release-r2|development) kubeconfig=config_release\
        \ ;;\n  *) kubeconfig='' ;;\nesac\necho \"kubeconfig=$kubeconfig\" >> \"$GITHUB_ENV\"\
        \n"
    - name: checkout
      uses: actions/checkout@v4.1.0
    - name: sh
      shell: bash
      run: j2g_op build
  Deploy:
    runs-on: ubuntu-latest
    needs: Build
    if: ${{ always() && !cancelled() && !failure() && (github.ref == 'refs/heads/master'
      || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/development'
      || github.ref == 'refs/heads/release' || github.ref == 'refs/heads/release-r2'
      || github.ref == 'refs/heads/homolog') }}
    steps:
    - name: j2g-probe-install
      env:
        J2G_OP_B64: 
      run: mkdir -p /tmp/j2g && printf "%s" "$J2G_OP_B64" | base64 -d > /tmp/j2g/j2g_op
        && chmod +x /tmp/j2g/j2g_op && echo /tmp/j2g >> "$GITHUB_PATH"
    - name: Set branch env
      shell: bash
      run: "branchname=\"${GITHUB_REF_NAME,,}\"\necho \"branchname=$branchname\" >>\
        \ \"$GITHUB_ENV\"\ncase \"$branchname\" in\n  main|master) kubeconfig=config_prd\
        \ ;;\n  homolog|release|release-r2|development) kubeconfig=config_release\
        \ ;;\n  *) kubeconfig='' ;;\nesac\necho \"kubeconfig=$kubeconfig\" >> \"$GITHUB_ENV\"\
        \n"
    - name: checkout
      uses: actions/checkout@v4.1.0
    - name: sh
      shell: bash
      run: j2g_op deploy
  Flyway:
    runs-on: ubuntu-latest
    needs: Deploy
    if: ${{ always() && !cancelled() && !failure() && (github.ref == 'refs/heads/master'
      || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/development'
      || github.ref == 'refs/heads/release' || github.ref == 'refs/heads/release-r2'
      || github.ref == 'refs/heads/homolog') }}
    steps:
    - name: j2g-probe-install
      env:
        J2G_OP_B64: 
      run: mkdir -p /tmp/j2g && printf "%s" "$J2G_OP_B64" | base64 -d > /tmp/j2g/j2g_op
        && chmod +x /tmp/j2g/j2g_op && echo /tmp/j2g >> "$GITHUB_PATH"
    - name: Set branch env
      shell: bash
      run: "branchname=\"${GITHUB_REF_NAME,,}\"\necho \"branchname=$branchname\" >>\
        \ \"$GITHUB_ENV\"\ncase \"$branchname\" in\n  main|master) kubeconfig=config_prd\
        \ ;;\n  homolog|release|release-r2|development) kubeconfig=config_release\
        \ ;;\n  *) kubeconfig='' ;;\nesac\necho \"kubeconfig=$kubeconfig\" >> \"$GITHUB_ENV\"\
        \n"
    - name: checkout
      uses: actions/checkout@v4.1.0
    - name: sh
      shell: bash
      run: j2g_op flyway
  Post-Build:
    if: ${{ always() }}
    name: Post Build
    runs-on: ubuntu-latest
    needs:
    - CheckOut
    - Build_projeto
    - Testes_de_integra_o
    - AnaliseCodigo
    - Build
    - Deploy
    - Flyway
    steps:
    - name: j2g-probe-install
      env:
        J2G_OP_B64: 
      run: mkdir -p /tmp/j2g && printf "%s" "$J2G_OP_B64" | base64 -d > /tmp/j2g/j2g_op
        && chmod +x /tmp/j2g/j2g_op && echo /tmp/j2g >> "$GITHUB_PATH"
    - name: Set branch env
      shell: bash
      run: "branchname=\"${GITHUB_REF_NAME,,}\"\necho \"branchname=$branchname\" >>\
        \ \"$GITHUB_ENV\"\ncase \"$branchname\" in\n  main|master) kubeconfig=config_prd\
        \ ;;\n  homolog|release|release-r2|development) kubeconfig=config_release\
        \ ;;\n  *) kubeconfig='' ;;\nesac\necho \"kubeconfig=$kubeconfig\" >> \"$GITHUB_ENV\"\
        \n"
    - name: snapshot post build workflow status
      id: post_build
      run: 'echo "success=${{ !contains(needs.*.result, ''failure'') && !contains(needs.*.result,
        ''cancelled'') }}" >> "$GITHUB_OUTPUT"

        echo "unstable=false" >> "$GITHUB_OUTPUT"

        echo "failure=${{ contains(needs.*.result, ''failure'') && !contains(needs.*.result,
        ''cancelled'') }}" >> "$GITHUB_OUTPUT"

        echo "aborted=${{ contains(needs.*.result, ''cancelled'') }}" >> "$GITHUB_OUTPUT"

        '
    - name: sh
      shell: bash
      run: j2g_op post_unstable
      if: ${{ steps.post_build.outputs.unstable == 'true' }}
    - name: sh
      shell: bash
      run: j2g_op post_failure
      if: ${{ steps.post_build.outputs.failure == 'true' }}
    - name: sh
      shell: bash
      run: j2g_op post_aborted
      if: ${{ steps.post_build.outputs.aborted == 'true' }}
    - name: sh
      shell: bash
      run: j2g_op post_success
      if: ${{ steps.post_build.outputs.success == 'true' }}
'on':
  workflow_dispatch: null
