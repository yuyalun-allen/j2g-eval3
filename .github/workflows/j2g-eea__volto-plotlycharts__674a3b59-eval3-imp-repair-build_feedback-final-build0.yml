name: j2g-importer-6682ed4d85e9
env:
  GIT_NAME: j2g-redacted
  NAMESPACE: j2g-redacted
  SONARQUBE_TAGS: j2g-redacted
  DEPENDENCIES: j2g-redacted
  BACKEND_PROFILES: j2g-redacted
  BACKEND_ADDONS: j2g-redacted
  CURRENT_VOLTO: j2g-redacted
  PREVIOUS_VOLTO: j2g-redacted
  IMAGE_NAME: ${{ github.run_id }}
  NODEJS_VERSION: j2g-redacted
  CHANGE_ID: ${{ github.event.pull_request.number }}
  CHANGE_TARGET: ${{ github.base_ref }}
  GITHUB_COMMENT: ${{ inputs.GITHUB_COMMENT || github.event.comment.body }}
  SKIP_TESTS: ${{ inputs.SKIP_TESTS && 'true' || '' }}
  J2G_RUN_ID: eea__volto-plotlycharts__674a3b59-eval3-imp-repair-build_feedback-final-build0
  J2G_FAULTS: ''
jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    if: ${{ !env.CHANGE_ID && github.ref_name == 'master' }}
    steps:
    - name: j2g-probe-install
      env:
        J2G_OP_B64: 
      run: mkdir -p /tmp/j2g && printf "%s" "$J2G_OP_B64" | base64 -d > /tmp/j2g/j2g_op
        && chmod +x /tmp/j2g/j2g_op && echo /tmp/j2g >> "$GITHUB_PATH"
    - name: checkout
      uses: actions/checkout@v4.1.0
    - name: sh
      shell: bash
      run: j2g_op release
  check_if_testing_needed:
    name: Check if testing needed
    runs-on: ubuntu-latest
    needs: release
    if: ${{ !failure() && !cancelled() && !env.CHANGE_ID && github.ref_name != 'master'
      && github.ref_name != 'develop' }}
    steps:
    - name: j2g-probe-install
      env:
        J2G_OP_B64: 
      run: mkdir -p /tmp/j2g && printf "%s" "$J2G_OP_B64" | base64 -d > /tmp/j2g/j2g_op
        && chmod +x /tmp/j2g/j2g_op && echo /tmp/j2g >> "$GITHUB_PATH"
    - name: checkout
      uses: actions/checkout@v4.1.0
    - name: sh
      shell: bash
      run: j2g_op check_if_testing_needed
  testing_volto18:
    name: Testing - Volto 18-yarn
    runs-on: ubuntu-latest
    needs: check_if_testing_needed
    if: ${{ !failure() && !cancelled() && ((env.CHANGE_ID && env.CHANGE_TARGET ==
      'develop') || (!env.CHANGE_ID && (!contains(github.event.head_commit.message
      || '', 'Automated release') || github.ref_name == 'master'))) }}
    steps:
    - name: j2g-probe-install
      env:
        J2G_OP_B64: 
      run: mkdir -p /tmp/j2g && printf "%s" "$J2G_OP_B64" | base64 -d > /tmp/j2g/j2g_op
        && chmod +x /tmp/j2g/j2g_op && echo /tmp/j2g >> "$GITHUB_PATH"
    - name: checkout
      uses: actions/checkout@v4.1.0
    - name: Build test image
      shell: bash
      run: j2g_op build_test_image
    - name: Fix code
      if: ${{ success() && !env.CHANGE_ID && github.ref_name != 'master' }}
      shell: bash
      run: j2g_op fix_code
    - name: ES lint
      if: ${{ success() && env.SKIP_TESTS == '' }}
      shell: bash
      run: j2g_op es_lint
    - name: Style lint
      if: ${{ success() && env.SKIP_TESTS == '' }}
      shell: bash
      run: j2g_op style_lint
    - name: Prettier
      if: ${{ success() && env.SKIP_TESTS == '' }}
      shell: bash
      run: j2g_op prettier
    - name: Unit tests
      if: ${{ success() && env.SKIP_TESTS == '' }}
      shell: bash
      run: j2g_op unit_tests
    - name: Integration tests
      if: ${{ success() && env.SKIP_TESTS == '' }}
      shell: bash
      run: j2g_op integration_tests --writes cypress-screenshots-current/**,cypress-videos-current/**/*.mp4
    - name: Report to SonarQube
      if: ${{ success() && ((env.CHANGE_ID && env.CHANGE_TARGET == 'develop' && env.SKIP_TESTS
        == '') || (!env.CHANGE_ID && env.SKIP_TESTS == '' && ((github.ref_name ==
        'develop' && !contains(github.event.head_commit.message || '', 'Automated
        release')) || github.ref_name == 'master'))) }}
      shell: bash
      run: j2g_op report_to_sonarqube
  testing_volto17:
    name: Testing - Volto 17
    runs-on: ubuntu-latest
    needs: check_if_testing_needed
    if: ${{ !failure() && !cancelled() && ((env.CHANGE_ID && env.CHANGE_TARGET ==
      'develop') || (!env.CHANGE_ID && (!contains(github.event.head_commit.message
      || '', 'Automated release') || github.ref_name == 'master'))) && env.SKIP_TESTS
      == '' && env.PREVIOUS_VOLTO != '' }}
    steps:
    - name: j2g-probe-install
      env:
        J2G_OP_B64: 
      run: mkdir -p /tmp/j2g && printf "%s" "$J2G_OP_B64" | base64 -d > /tmp/j2g/j2g_op
        && chmod +x /tmp/j2g/j2g_op && echo /tmp/j2g >> "$GITHUB_PATH"
    - name: checkout
      uses: actions/checkout@v4.1.0
    - name: Build test image
      shell: bash
      run: j2g_op build_test_image_2
    - name: Unit tests
      shell: bash
      run: j2g_op unit_tests_2
    - name: Integration tests
      shell: bash
      run: j2g_op integration_tests_2 --writes cypress-screenshots-previous/**,cypress-videos-previous/**/*.mp4
  testing_post:
    name: Testing Post
    runs-on: ubuntu-latest
    needs:
    - testing_volto18
    - testing_volto17
    if: ${{ always() && (needs.testing_volto18.result != 'skipped' || needs.testing_volto17.result
      != 'skipped') }}
    steps:
    - name: j2g-probe-install
      env:
        J2G_OP_B64: 
      run: mkdir -p /tmp/j2g && printf "%s" "$J2G_OP_B64" | base64 -d > /tmp/j2g/j2g_op
        && chmod +x /tmp/j2g/j2g_op && echo /tmp/j2g >> "$GITHUB_PATH"
    - name: checkout
      uses: actions/checkout@v4.1.0
    - name: sh
      shell: bash
      run: j2g_op testing_post_always
  sonarqube_compare:
    name: SonarQube compare to master
    runs-on: ubuntu-latest
    needs:
    - testing_volto18
    - testing_volto17
    - testing_post
    if: ${{ !failure() && !cancelled() && ((env.CHANGE_ID && env.CHANGE_TARGET ==
      'develop' && env.SKIP_TESTS == '') || (!env.CHANGE_ID && env.SKIP_TESTS == ''
      && github.ref_name == 'develop' && !contains(github.event.head_commit.message
      || '', 'Automated release'))) }}
    steps:
    - name: j2g-probe-install
      env:
        J2G_OP_B64: 
      run: mkdir -p /tmp/j2g && printf "%s" "$J2G_OP_B64" | base64 -d > /tmp/j2g/j2g_op
        && chmod +x /tmp/j2g/j2g_op && echo /tmp/j2g >> "$GITHUB_PATH"
    - name: checkout
      uses: actions/checkout@v4.1.0
    - name: sh
      shell: bash
      run: j2g_op sonarqube_compare_to_master
  storybook:
    name: Storybook
    runs-on: ubuntu-latest
    needs: sonarqube_compare
    if: ${{ !failure() && !cancelled() && (contains(env.GITHUB_COMMENT || '', '@eea-jenkins
      build all') || contains(env.GITHUB_COMMENT || '', '@eea-jenkins build storybook'))
      }}
    steps:
    - name: j2g-probe-install
      env:
        J2G_OP_B64: 
      run: mkdir -p /tmp/j2g && printf "%s" "$J2G_OP_B64" | base64 -d > /tmp/j2g/j2g_op
        && chmod +x /tmp/j2g/j2g_op && echo /tmp/j2g >> "$GITHUB_PATH"
    - name: checkout
      uses: actions/checkout@v4.1.0
    - name: sh
      shell: bash
      run: j2g_op storybook
  pull_request:
    name: Pull Request
    runs-on: ubuntu-latest
    needs: storybook
    if: ${{ !failure() && !cancelled() && env.CHANGE_ID && env.CHANGE_TARGET == 'master'
      }}
    steps:
    - name: j2g-probe-install
      env:
        J2G_OP_B64: 
      run: mkdir -p /tmp/j2g && printf "%s" "$J2G_OP_B64" | base64 -d > /tmp/j2g/j2g_op
        && chmod +x /tmp/j2g/j2g_op && echo /tmp/j2g >> "$GITHUB_PATH"
    - name: checkout
      uses: actions/checkout@v4.1.0
    - name: sh
      shell: bash
      run: j2g_op pull_request
  post_build:
    name: Post Build
    runs-on: ubuntu-latest
    needs:
    - release
    - check_if_testing_needed
    - testing_volto18
    - testing_volto17
    - testing_post
    - sonarqube_compare
    - storybook
    - pull_request
    if: ${{ always() }}
    steps:
    - name: j2g-probe-install
      env:
        J2G_OP_B64: 
      run: mkdir -p /tmp/j2g && printf "%s" "$J2G_OP_B64" | base64 -d > /tmp/j2g/j2g_op
        && chmod +x /tmp/j2g/j2g_op && echo /tmp/j2g >> "$GITHUB_PATH"
    - name: checkout
      uses: actions/checkout@v4.1.0
    - name: sh - post_always
      shell: bash
      run: j2g_op post_always
    - name: sh - post_changed
      if: ${{ always() }}
      shell: bash
      run: j2g_op post_changed
'on':
  workflow_dispatch:
    inputs:
      SKIP_TESTS:
        type: boolean
        default: false
      GITHUB_COMMENT:
        type: string
        required: false
